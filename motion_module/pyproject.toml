[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motion-person"
version = "0.2.0"
description = "NoteCam's vendored motion-person capture library"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["opencv-python", "numpy"]

[project.optional-dependencies]
yolo = ["ultralytics==8.4.174", "lap>=0.5.12"]

[tool.setuptools.packages.find]
include = ["motion_person*"]

[tool.setuptools.package-data]
motion_person = ["py.typed"]
