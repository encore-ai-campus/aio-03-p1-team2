[project]
name = "notecam-backend"
version = "0.1.0"
description = "NoteCam FastAPI backend with shared Supabase connections"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.9,<3",
    "python-multipart>=0.0.20,<1",
    "python-dotenv>=1,<2",
    "httpx>=0.28,<1",
    "PyJWT>=2.10,<3",
    "pillow>=11,<13",
    "motion-person[yolo]",
    "google-genai>=2.31.0",
    "filelock>=3.16,<5",
    "supabase>=2.32,<3",
    "redis>=6,<8",
]
[project.optional-dependencies]
camera = ["opencv-python>=4.10,<5"]

[dependency-groups]
dev = ["pytest>=8,<10", "psycopg[binary]>=3.2,<4"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.sources]
motion-person = { path = "motion_module", editable = true }
